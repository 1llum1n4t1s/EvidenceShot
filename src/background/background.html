<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>EvidenceShot Background</title>
    <!--
      Firefox MV3 用 event page。Chrome の MV3 では使われず、Firefox に同梱する
      manifest.firefox.json 側で background.page にこの HTML を指定する。
      Chrome は manifest.json で background.service_worker を使うので、このファイルは
      Chrome ZIP からは除外される。

      offscreen.html と同じく、Canvas へのスタンプ描画で UDEV Gothic JPDOC を確実に
      使うため <link rel="preload"> と @font-face をここで宣言しておく。
      composer.js は読み込み時に document.fonts.load() を発火する。
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="../shared/fonts/UDEVGothicJPDOC-Regular.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="../shared/fonts/UDEVGothicJPDOC-Bold.woff2" />
    <style>
      @font-face {
        font-family: "UDEVGothicJPDOC";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("../shared/fonts/UDEVGothicJPDOC-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "UDEVGothicJPDOC";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("../shared/fonts/UDEVGothicJPDOC-Bold.woff2") format("woff2");
      }
    </style>
  </head>
  <body>
    <!--
      Script の読み込み順序:
        1. constants.js   グローバル定数
        2. utils.js       Shared ヘルパ (loadSettings / buildFileName / respondAsync / ...)
        3. stamp-renderer.js  Canvas へのスタンプ描画
        4. composer.js    Canvas 合成・PNG iTXt 埋込 (globalThis.EvidenceShotComposer を export)
        5. background.js  撮影オーケストレーション (composer を呼ぶ)
      Firefox は importScripts が無いため、ここで script タグを直接並べて読み込む。
    -->
    <script src="../shared/constants.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="../offscreen/stamp-renderer.js"></script>
    <script src="../shared/composer.js"></script>
    <script src="./background.js"></script>
  </body>
</html>
