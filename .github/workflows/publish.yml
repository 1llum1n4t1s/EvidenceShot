name: Publish to Chrome Web Store & Firefox AMO

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  publish:
    name: Chrome Web Store & Firefox AMO 公開
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: manifest のバージョン取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名と manifest バージョンを検証
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: pnpm セットアップ
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - name: Node をセットアップ
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 依存関係をインストール
        # 公開用 secrets を扱う同一 job では依存の lifecycle script を走らせない。
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 依存インストール後の公開対象差分を検証
        run: |
          dirty=$(git status --porcelain --untracked-files=all -- manifest.json package.json pnpm-lock.yaml pnpm-workspace.yaml _locales src scripts)
          if [ -n "$dirty" ]; then
            echo "::error::pnpm install 後に公開対象ファイルへ差分が出ました"
            echo "$dirty"
            exit 1
          fi

      - name: package.json と manifest.json のバージョンを検証
        env:
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          if [ "$pkg_ver" != "$MANIFEST_VERSION" ]; then
            echo "::error::package.json ($pkg_ver) と manifest.json ($MANIFEST_VERSION) が一致しません"
            exit 1
          fi
          # pnpm-lock.yaml はプロジェクト version を保持しないため lockfile バージョン照合は行わない。
          # lockfile と package.json の整合性は上の pnpm install --frozen-lockfile が担保する。

      - name: アイコンを生成
        run: node scripts/generate-icons.js

      - name: ZIP パッケージを作成
        run: |
          zip -r evidence-shot.zip manifest.json _locales icons src \
            -x "*.DS_Store" "*.swp" "*~"
          ls -lh evidence-shot.zip

      - name: Chrome Web Store にアップロード & 公開
        # chrome-webstore-upload-cli はローカル devDep にインストール済 (package.json で固定)。
        # secrets を持つステップでレジストリから未検証コードを取得しない方針のため
        # `pnpm exec` を指定し、node_modules 内のローカル版だけを呼ぶ (無ければ失敗する)。
        # v4 以降は --client-id 等の CLI フラグが廃止され、環境変数 (CLIENT_ID 等) が必須。
        # PUBLISHER_ID も新規必須項目。コマンド (upload/publish) を省略すると
        # upload → publish の両方が自動実行される。
        # バイナリ名は `chrome-webstore-upload` (npm パッケージ名 chrome-webstore-upload-cli とは別名)。
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          pnpm exec chrome-webstore-upload --source evidence-shot.zip
          echo "🎉 Chrome Web Store への公開リクエストを送信したよ〜"

      - name: Firefox 用ビルドディレクトリを生成
        # Chrome step が失敗 (同 version 再 upload 等) しても Firefox AMO は独立して
        # 実行する必要があるので、success() に加え failure() の場合も実行する
        # (cancelled 時は skip)。
        if: ${{ success() || failure() }}
        run: |
          node scripts/build-firefox.js
          echo "📦 Firefox source dir contents:"
          ls -la firefox-build

      - name: Firefox AMO に submission API でアップロード
        # Chrome 失敗時も実行する (前 step の Firefox ディレクトリ準備が success なら OK)。
        if: ${{ success() || failure() }}
        env:
          # web-ext は WEB_EXT_API_KEY / WEB_EXT_API_SECRET を環境変数から読む。
          # AMO API キーは https://addons.mozilla.org/developers/addon/api/key/ で発行。
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # web-ext はローカル devDep にインストール済 (package.json で固定)。
        # Chrome 側と同じく `pnpm exec` で node_modules 内のローカル版を呼ぶ。
        # web-ext 10+ では submission API がデフォルト動作のため --use-submission-api フラグは不要。
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER / AMO_JWT_SECRET の GitHub Secrets が未設定です"
            exit 1
          fi
          # --approval-timeout 0 で AMO 人手レビューの承認待ちを行わず即 exit する。
          # AMO listed channel は数時間〜数日のレビューが必要で、デフォルト 900s だと
          # 必ずタイムアウト失敗する。submission 自体は成功しているので、レビュー結果は
          # AMO Developer Hub (https://addons.mozilla.org/developers/addon/evidenceshot/)
          # で確認する運用に統一する。
          pnpm exec web-ext sign \
            --source-dir=firefox-build \
            --artifacts-dir=web-ext-artifacts \
            --channel=listed \
            --amo-metadata=amo-metadata.json \
            --approval-timeout 0
          echo "🦊 Firefox AMO への submission を送信したよ〜 (レビュー待ち)"
