name: Publish to Chrome Web Store & Firefox AMO

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Chrome Web Store & Firefox AMO 公開
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: manifest のバージョン取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名と manifest バージョンを検証
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: Prepare native Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile 'package.json'

      - name: 依存関係をインストール
        # 公開用 secrets を扱う同一 job では依存の lifecycle script を走らせない。
        run: bun run deps --ignore-scripts
      - name: Test dependency security regressions
        run: bun --bun run test:dependencies

      - name: 依存インストール後の公開対象差分を検証
        run: |
          dirty=$(git status --porcelain --untracked-files=all -- manifest.json package.json bun.lock bunfig.toml _locales src scripts)
          if [ -n "$dirty" ]; then
            echo "::error::bun install 後に公開対象ファイルへ差分が出ました"
            echo "$dirty"
            exit 1
          fi

      - name: package.json と manifest.json のバージョンを検証
        env:
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg_ver=$(bun -p "require('./package.json').version")
          if [ "$pkg_ver" != "$MANIFEST_VERSION" ]; then
            echo "::error::package.json ($pkg_ver) と manifest.json ($MANIFEST_VERSION) が一致しません"
            exit 1
          fi
          # bun.lock はプロジェクト version を保持しないため lockfile バージョン照合は行わない。
          # lockfile と package.json の整合性は上の bun run deps が担保する。

      - name: アイコンを生成
        run: bun scripts/generate-icons.js

      - name: ZIP パッケージを作成
        run: |
          zip -r evidence-shot.zip manifest.json _locales icons src \
            -x "*.DS_Store" "*.swp" "*~"
          ls -lh evidence-shot.zip

      - name: Chrome Web Store にアップロード & 公開
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishCws.ps1 -WorkDirectory "$RUNNER_TEMP/cws-publisher-tests"
          pwsh -NoProfile -File scripts/Publish-Cws.ps1 -Archive "evidence-shot.zip"

      - name: Firefox 用ビルドディレクトリを生成
        # Chrome step が失敗 (同 version 再 upload 等) しても Firefox AMO は独立して
        # 実行する必要があるので、success() に加え failure() の場合も実行する
        # (cancelled 時は skip)。
        if: ${{ success() || failure() }}
        run: |
          bun scripts/build-firefox.js
          echo "📦 Firefox source dir contents:"
          ls -la firefox-build

      - name: Firefox AMO に submission API でアップロード
        if: ${{ success() || failure() }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishAmo.ps1 -WorkDirectory "$RUNNER_TEMP/amo-publisher-tests"
          test ! -e firefox-build/.amo-upload-uuid
          mkdir -p web-ext-artifacts
          ARCHIVE="$GITHUB_WORKSPACE/web-ext-artifacts/unsigned-submission.xpi"
          test ! -e "$ARCHIVE"
          pwsh -NoProfile -File scripts/Test-FirefoxArchive.ps1 -WorkDirectory "$RUNNER_TEMP/firefox-archive-tests"
          pwsh -NoProfile -File scripts/New-FirefoxArchive.ps1 -SourceDirectory firefox-build -Archive "$ARCHIVE" > web-ext-artifacts/build-receipt.json
          VERSION=$(python3 -c 'import json; print(json.load(open("firefox-build/manifest.json"))["version"])')
          ADDON_ID=$(python3 -c 'import json; m=json.load(open("firefox-build/manifest.json")); print(m.get("browser_specific_settings",m.get("applications",{}))["gecko"]["id"])')
          SHA256=$(python3 -c 'import json; print(json.load(open("web-ext-artifacts/build-receipt.json"))["sha256"])')
          pwsh -NoProfile -File scripts/Publish-Amo.ps1 -Archive "$ARCHIVE" -Metadata amo-metadata.json -AddonId "$ADDON_ID" -ExpectedVersion "$VERSION" -ExpectedSha256 "$SHA256"
