name: Publish to Chrome Web Store & Firefox AMO

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  publish:
    name: Chrome Web Store & Firefox AMO 公開
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: manifest のバージョン取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名と manifest バージョンを検証
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: Node をセットアップ
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係をインストール
        # 公開用 secrets を扱う同一 job では依存の lifecycle script を走らせない。
        run: npm ci --ignore-scripts

      - name: 依存インストール後の公開対象差分を検証
        run: |
          dirty=$(git status --porcelain --untracked-files=all -- manifest.json package.json package-lock.json _locales src scripts)
          if [ -n "$dirty" ]; then
            echo "::error::npm ci 後に公開対象ファイルへ差分が出ました"
            echo "$dirty"
            exit 1
          fi

      - name: package.json と manifest.json のバージョンを検証
        env:
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          if [ "$pkg_ver" != "$MANIFEST_VERSION" ]; then
            echo "::error::package.json ($pkg_ver) と manifest.json ($MANIFEST_VERSION) が一致しません"
            exit 1
          fi
          lock_ver=$(node -p "require('./package-lock.json').version")
          if [ "$lock_ver" != "$MANIFEST_VERSION" ]; then
            echo "::error::package-lock.json ($lock_ver) と manifest.json ($MANIFEST_VERSION) が一致しません"
            exit 1
          fi

      - name: アイコンを生成
        run: node scripts/generate-icons.js

      - name: ZIP パッケージを作成
        run: |
          zip -r evidence-shot.zip manifest.json _locales icons src \
            -x "*.DS_Store" "*.swp" "*~"
          ls -lh evidence-shot.zip

      - name: Chrome Web Store にアップロード & 公開
        # chrome-webstore-upload-cli はローカル devDep にインストール済 (package.json で固定)。
        # secrets を持つステップで npm レジストリから未検証コードを取得しない方針のため
        # `npx --no-install` を指定し、node_modules に無ければ失敗させる。
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          npx --no-install chrome-webstore-upload-cli upload \
            --source evidence-shot.zip \
            --extension-id "$CWS_EXTENSION_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN" \
            --auto-publish
          echo "🎉 Chrome Web Store への公開リクエストを送信したよ〜"

      - name: Firefox 用ビルドディレクトリを生成
        # Chrome step が失敗 (同 version 再 upload 等) しても Firefox AMO は独立して
        # 実行する必要があるので、success() に加え failure() の場合も実行する
        # (cancelled 時は skip)。
        if: ${{ success() || failure() }}
        run: |
          node scripts/build-firefox.js
          echo "📦 Firefox source dir contents:"
          ls -la firefox-build

      - name: Firefox AMO に submission API でアップロード
        # Chrome 失敗時も実行する (前 step の Firefox ディレクトリ準備が success なら OK)。
        if: ${{ success() || failure() }}
        env:
          # web-ext は WEB_EXT_API_KEY / WEB_EXT_API_SECRET を環境変数から読む。
          # AMO API キーは https://addons.mozilla.org/developers/addon/api/key/ で発行。
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # web-ext はローカル devDep にインストール済 (package.json で固定)。
        # Chrome 側と同じく `npx --no-install` で node_modules 内のローカル版を呼ぶ。
        # web-ext 10+ では submission API がデフォルト動作のため --use-submission-api フラグは不要。
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER / AMO_JWT_SECRET の GitHub Secrets が未設定です"
            exit 1
          fi
          npx --no-install web-ext sign \
            --source-dir=firefox-build \
            --artifacts-dir=web-ext-artifacts \
            --channel=listed \
            --amo-metadata=amo-metadata.json
          echo "🦊 Firefox AMO への submission を送信したよ〜 (レビュー待ち)"
